<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Freelancer Portfolio</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>My Portfolio</h1>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container justify-content-center">

            <a class="nav-link text-white" href="#bio">Bio</a>
            <a class="nav-link text-white" href="#gallery">Gallery</a>
            <a class="nav-link text-white" href="#testimonials">Testimonials</a>

            <!-- Dropdown Added -->
            <div class="dropdown">
                <a class="nav-link dropdown-toggle text-white" href="#" data-bs-toggle="dropdown">
                    More
                </a>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#contact">Contact</a></li>
                    <li><a class="dropdown-item" data-bs-toggle="modal" data-bs-target="#infoModal">Open Modal</a></li>
                </ul>
            </div>

        </div>
    </nav>
</header>

<div class="container">

    <!-- Breadcrumb Added -->
    <nav class="mt-3">
        <ol class="breadcrumb justify-content-center">
            <li class="breadcrumb-item active">Home</li>
            <li class="breadcrumb-item">Portfolio</li>
        </ol>
    </nav>

    <section id="bio">
        <h2>About Me</h2>
        <p>I am a freelance graphic designer.</p>
    </section>

    <section id="gallery">
        <h2>My Work</h2>

        <button class="btn btn-primary">All</button>
        <button class="btn btn-outline-primary">Logos</button>
        <button class="btn btn-outline-primary">Posters</button>

        <div>
            <img src="image/img1.jpg" alt="logo" class="img-fluid">
            <p>Logo</p>
        </div>

        <div>
            <img src="image/img2.jpg" alt="poster" class="img-fluid">
            <p>Poster</p>
        </div>
    </section>

    <section id="testimonials">
        <h2>Testimonials</h2>
        <div class="alert alert-success">
            "Great work!" - Client
        </div>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <form class="w-75 mx-auto">
            <input type="text" class="form-control mb-2" placeholder="Name">
            <input type="email" class="form-control mb-2" placeholder="Email">
            <textarea class="form-control mb-2" placeholder="Message"></textarea>
            <button type="submit" class="btn btn-primary">Send</button>
        </form>
    </section>

</div>

<footer>
    <p>© 2026 My Portfolio</p>
</footer>

<!-- Modal Added -->
<div class="modal fade" id="infoModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Portfolio Info</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                This is a Bootstrap Modal example.
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
