<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Freelancer Portfolio</title>
<link rel="stylesheet" href="style.css">
    
</head>

<body>

<header>
    <h1>My Portfolio</h1>
    <nav>
        <a href="#bio">Bio</a>
        <a href="#gallery">Gallery</a>
        <a href="#testimonials">Testimonials</a>
        <a href="#contact">Contact</a>
    </nav>
</header>

<section id="bio">
    <h2>About Me</h2>
    <p>I am a freelance graphic designer.</p>
</section>

<section id="gallery">
    <h2>My Work</h2>

    <button>All</button>
    <button>Logos</button>
    <button>Posters</button>

    <div>
        <img src="image/img1.jpg" alt="logo">
        <p>Logo</p>
    </div>

    <div>
        <img src="image/img2.jpg" alt="poster">
        <p>Poster</p>
    </div>
</section>

<section id="testimonials">
    <h2>Testimonials</h2>
    <p>"Great work!" - Client</p>
</section>

<section id="contact">
    <h2>Contact</h2>
    <form>
        <input type="text" placeholder="Name"><br>
        <input type="email" placeholder="Email"><br>
        <textarea placeholder="Message"></textarea><br>
        <button type="submit">Send</button>
    </form>
</section>

<footer>
    <p>© 2026 My Portfolio</p>
</footer>

</body>
</html>
