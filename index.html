<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Freelancer Portfolio</title><style>
    body {
        font-family: Arial;
        margin: 0;
    }

    header {
        background: #4e54c8;
        color: white;
        text-align: center;
        padding: 15px;
    }

    nav a {
        color: white;
        margin: 10px;
        text-decoration: none;
    }

    section {
        padding: 20px;
        text-align: center;
    }

    /* Gallery */
    #gallery div {
        display: inline-block;
        margin: 10px;
    }

    img {
        width: 200px;
        border-radius: 10px;
    }

    /* Buttons */
    button {
        padding: 8px 12px;
        margin: 5px;
        background: #4e54c8;
        color: white;
        border: none;
        border-radius: 5px;
    }

    /* Form */
    input, textarea {
        width: 80%;
        padding: 8px;
        margin: 5px;
    }

    footer {
        background: #333;
        color: white;
        text-align: center;
        padding: 10px;
    }
</style>

</head>
<body><header>
    <h1>My Portfolio</h1>
    <nav>
        <a href="#bio">Bio</a>
        <a href="#gallery">Gallery</a>
        <a href="#testimonials">Testimonials</a>
        <a href="#contact">Contact</a>
    </nav>
</header><section id="bio">
    <h2>About Me</h2>
    <p>I am a freelance graphic designer.</p>
</section><section id="gallery">
    <h2>My Work</h2><button>All</button>
<button>Logos</button>
<button>Posters</button>

<div>
    <img src="image/image1.jpg">
    <p>Logo</p>
</div>

<div>
    <img src="image/image2.jpg">
    <p>Poster</p>
</div>

</section><section id="testimonials">
    <h2>Testimonials</h2>
    <p>"Great work!" - Client</p>
</section><section id="contact">
    <h2>Contact</h2>
    <form>
        <input type="text" placeholder="Name"><br>
        <input type="email" placeholder="Email"><br>
        <textarea placeholder="Message"></textarea><br>
        <button type="submit">Send</button>
    </form>
</section><footer>
    <p>© 2026 My Portfolio</p>
</footer></body>
</html>
